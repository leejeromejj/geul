<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEUL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mute:#8a8f98;--line:#ececee;--chip:#f4f4f5}
@media(prefers-color-scheme:dark){:root{--bg:#101012;--fg:#f2f2f3;--mute:#8d9099;--line:#26262a;--chip:#1c1c20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 6px}
.logo{font-weight:900;font-size:22px;letter-spacing:.1em}
.av{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0;color:var(--mute);font-weight:500}
.tabs button[aria-current=true]{color:var(--fg);font-weight:700;border-color:var(--fg)}
main{padding:20px 20px 56px}
.art{aspect-ratio:4/3;border-radius:18px;display:grid;place-items:center;font-size:76px;color:#16213A}
.meta{margin:18px 0 2px;font-size:13px;color:var(--mute)}
h2{margin:0;font-size:28px;line-height:1.35;font-weight:900;letter-spacing:-.02em}
.word{margin:2px 0 14px;font-size:14px;color:var(--mute)}
.read{font-family:'Noto Serif KR',serif;font-size:17px;line-height:1.9;margin:0}
.act{display:flex;gap:8px;margin-top:24px}
.btn{height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:700}
.btn.main{flex:1;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.on{background:var(--chip)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
.q{font-family:'Noto Serif KR',serif;font-size:23px;line-height:1.65;font-weight:600;margin:12px 0 18px}
textarea,.ttl{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:17px/1.85 'Noto Serif KR',serif;padding:8px 0;border-radius:0;resize:none;outline:none}
textarea{min-height:140px}
textarea:focus,.ttl:focus{border-color:var(--fg)}
.ttl{margin-bottom:6px;font-weight:600}
.msg{min-height:20px;margin-top:8px;font-size:13px;color:var(--mute)}
.feed{margin-top:28px}
.post{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.post .t{min-width:0;flex:1}
.post b{font-size:14px}
.post strong{display:block;font-family:'Noto Serif KR',serif}
.post p{margin:2px 0 0;font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.post button{border:0;background:none;padding:0;margin-top:4px;font-size:12px;color:var(--mute)}
.login{padding-top:18vh;text-align:center}
.login h1{margin:0 0 28px;font-size:46px;font-weight:900;letter-spacing:.1em}
.login input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:none;color:inherit;font:inherit;text-align:center}
.login .btn{width:100%;margin-top:10px}
.item{display:flex;gap:14px;align-items:center;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.item .th{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;color:#16213A}
.item b{display:block}
.item small{color:var(--mute)}
.who{display:flex;align-items:center;gap:10px}
.out{border:0;background:none;color:var(--mute);font-size:13px;padding:0}
.login .btn{margin-top:8px}
.login .sub{background:none}
.more{border:0;background:none;color:var(--mute);font-size:13px;padding:0;margin-top:6px}
.day{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.tabs button{font-size:15px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead .more{font-size:24px;margin:0;color:var(--fg);padding:0 8px}
.calhead .more:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal i{font-style:normal;font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{aspect-ratio:1;border:0;border-radius:50%;background:none;font:inherit;font-size:14px;position:relative}
.cal .d.today{font-weight:900;box-shadow:inset 0 0 0 1px var(--fg)}
.cal .d.sel{background:var(--fg);color:var(--bg)}
.cal .d.has::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cal .d:disabled{opacity:.28;cursor:default}
button.av{border:0;color:inherit;cursor:pointer}
.pv{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-top:10px}
.pv[hidden]{display:none}
.ph{display:block;max-width:100%;border-radius:12px;margin-top:8px}
.pr{display:flex;gap:14px;align-items:center;margin-top:6px}
.post .pr button{margin:0;font-size:13px}
.post .pr .hb{font-size:15px}
.post .pr .hb.on{color:#E5484D}
.dh{margin:22px 0 4px}
main{padding-bottom:104px}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.bar .btn{white-space:nowrap;font-size:15px;padding:0 12px}
.bar .btn:first-child{flex:1}
.bar #nx{flex:0 0 42%}
.top{display:flex;gap:8px;align-items:center}
.top .more{margin:0 0 0 auto;font-size:14px;color:var(--fg)}
.seg{display:flex;gap:6px;margin-bottom:18px}
.seg button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 16px;font-size:14px}
.seg button[aria-current=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bd{background:#E5484D;color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:3px;vertical-align:top}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:440px;width:calc(100% - 32px);background:var(--fg);color:var(--bg);border:0;border-radius:14px;padding:12px 16px;font:inherit;font-size:14px;z-index:20;text-align:left}
#toast[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.chip .x{border:0;background:none;padding:0 0 0 4px;font-size:14px}
.tp{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.lock p{color:var(--mute)}
.go{text-decoration:underline}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .card{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;text-align:center}
.sheet .card h3{margin:0}
.sheet .btn[disabled]{opacity:.5}
.av.big{width:56px;height:56px;font-size:22px;margin:0 auto}
.pf{cursor:pointer}
.req{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.req .btn{height:34px;padding:0 14px;font-size:14px;margin-left:6px}
</style>
</head>

const SUPABASE_URL = 'https://uwfcxcuohsiwoxkwdtoh.supabase.co';

const sb = LIVE ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const CARDS = [
 {e:'🏛️',c:'#C9D6FF',cat:'철학',t:'아포리아',w:'aporia',d:'길이 막혀 더 나아갈 수 없는 상태. 소크라테스는 대화로 상대를 이 지점까지 데려가, 안다고 믿던 것이 사실은 모른다는 걸 깨닫게 했습니다. 모름을 아는 순간이 배움의 출발점입니다.'},
 {e:'🌊',c:'#BDE7F2',cat:'문학',t:'의식의 흐름',w:'stream of consciousness',d:'인물의 머릿속에 스치는 생각을 문법과 논리의 정리 없이 이어 쓰는 기법. 울프와 조이스가 대표적이며, 사람의 마음은 문장처럼 반듯하게 흐르지 않는다는 발견에서 나왔습니다.'},
 {e:'🪞',c:'#E3D4FF',cat:'심리학',t:'페르소나',w:'persona',d:'원래 고대 연극에서 배우가 쓰던 가면. 융은 이를 사회에서 요구받는 역할에 맞춰 내보이는 얼굴이라 불렀습니다. 가면이 나쁜 건 아니지만, 가면과 나를 혼동할 때 문제가 생깁니다.'},
 {e:'🍵',c:'#D5EBCF',cat:'미학',t:'와비사비',w:'侘寂',d:'불완전하고 덧없고 소박한 것에서 아름다움을 찾는 일본의 미의식. 금이 간 찻잔을 금으로 이어 붙이는 킨츠기에도 같은 생각이 담겨 있습니다.'},
 {e:'⚖️',c:'#FFE3B8',cat:'윤리학',t:'트롤리 딜레마',w:'trolley problem',d:'다섯 명을 살리려 한 명을 희생시켜도 되는가. 결과를 따지는 공리주의와 행위 자체의 옳고 그름을 따지는 의무론이 갈라지는 지점을 보여 주는 사고실험입니다.'},
 {e:'📜',c:'#F6CFCF',cat:'역사',t:'르네상스',w:'Renaissance',d:'프랑스어로 재탄생. 14~16세기 유럽에서 고대 그리스·로마의 인간 중심 사고를 되살려 예술과 학문을 일으킨 흐름입니다. 신 중심에서 인간 중심으로 시선이 옮겨 갔습니다.'},
 {e:'🗣️',c:'#CFE0F6',cat:'언어학',t:'사피어-워프 가설',w:'linguistic relativity',d:'우리가 쓰는 언어가 생각의 틀을 만든다는 주장. 색을 가리키는 낱말이 적은 언어권 사람은 색을 다르게 나눠 인식하는가 하는 실험들이 이어져 왔고, 강한 형태는 지금 대체로 부정됩니다.'},
 {e:'🕯️',c:'#EAD9C4',cat:'문학',t:'카타르시스',w:'catharsis',d:'아리스토텔레스가 비극의 효과로 꼽은 감정의 정화. 연민과 공포를 대신 겪고 나면 마음이 가벼워진다는 뜻으로, 오늘의 눈물 나는 영화와도 이어집니다.'},
 {e:'🔭',c:'#C8D3E8',cat:'과학철학',t:'패러다임',w:'paradigm',d:'쿤이 제시한 말로, 한 시대 과학자들이 공유하는 문제 설정과 사고의 틀. 천동설에서 지동설로 가듯 틀이 통째로 바뀌는 일을 과학혁명이라 불렀습니다.'},
 {e:'🌀',c:'#DCD0F2',cat:'사회학',t:'아노미',w:'anomie',d:'뒤르켐이 말한, 기존 규범이 무너졌는데 새 규범은 서지 않아 사람들이 방향을 잃는 상태. 급격한 사회 변화 속에서 생기는 혼란과 소외를 설명합니다.'},
 {e:'🧠',c:'#F3D6E4',cat:'심리학',t:'인지 부조화',w:'cognitive dissonance',d:'자신의 믿음과 행동이 어긋날 때 느끼는 불편함. 사람은 이 불편을 줄이려고 행동을 바꾸기보다 생각을 바꿔 합리화하기도 합니다. 여우와 신 포도 이야기가 그 예입니다.'},
 {e:'👁️',c:'#D6E4F3',cat:'심리학',t:'확증 편향',w:'confirmation bias',d:'내가 이미 믿는 것을 뒷받침하는 정보만 찾고 반대 증거는 흘려 넘기는 경향. 똑똑한 사람도 피하기 어렵고, 그래서 일부러 반대 의견을 찾아보는 습관이 필요합니다.'},
 {e:'🎭',c:'#EED9F5',cat:'심리학',t:'투사',w:'projection',d:'자기 안의 받아들이기 힘든 감정이나 욕구를 남의 것으로 돌려 보는 방어기제. 내가 불안한데 상대가 나를 불안하게 한다고 느끼는 식입니다.'},
 {e:'🧒',c:'#FFE9C7',cat:'발달심리',t:'애착 이론',w:'attachment theory',d:'볼비와 에인스워스가 정리한 이론. 어린 시절 양육자와 맺은 관계가 이후 대인관계의 기본 틀이 된다고 봅니다. 안정, 불안, 회피 같은 유형으로 나눕니다.'},
 {e:'🍀',c:'#D9F0D2',cat:'심리학',t:'학습된 무기력',w:'learned helplessness',d:'피할 수 없는 고통을 반복해서 겪은 뒤, 피할 수 있는 상황에서도 시도하지 않게 되는 상태. 셀리그먼의 실험에서 출발해 우울을 이해하는 단서가 되었습니다.'},
 {e:'🔥',c:'#F9D5C8',cat:'심리학',t:'몰입',w:'flow',d:'칙센트미하이가 이름 붙인 상태로, 과제의 난도와 내 실력이 알맞게 맞물려 시간 가는 줄 모르고 빠져드는 경험. 너무 쉬우면 지루하고 너무 어려우면 불안해집니다.'},
 {e:'🏙️',c:'#CFE3F0',cat:'사회학',t:'젠트리피케이션',w:'gentrification',d:'낙후된 동네가 뜨면서 임대료가 오르고, 원래 살던 주민과 가게가 밀려나는 현상. 활기를 얻는 대신 그 동네를 만든 사람들을 잃는다는 역설이 있습니다.'},
 {e:'🪟',c:'#DDE5F4',cat:'사회학',t:'낙인 효과',w:'labeling theory',d:'사회가 어떤 사람에게 일탈자라는 이름표를 붙이면, 그 사람이 실제로 그 이름표에 맞게 행동하게 된다는 관점. 베커가 대표적 이론가입니다.'},
 {e:'🧭',c:'#E4DDF4',cat:'사회학',t:'사회적 자본',w:'social capital',d:'돈이나 학력처럼 눈에 보이지 않는, 신뢰와 인간관계망이 주는 자원. 퍼트넘은 모임과 신뢰가 풍부한 공동체일수록 민주주의도 잘 작동한다고 보았습니다.'},
 {e:'🎬',c:'#F4E1D2',cat:'사회학',t:'상징적 상호작용론',w:'symbolic interactionism',d:'사회를 거대한 구조가 아니라 사람들이 의미를 주고받는 일상의 상호작용으로 보는 시각. 같은 행동도 서로 어떻게 해석하느냐에 따라 전혀 다른 일이 됩니다.'},
 {e:'🗳️',c:'#D3E6E0',cat:'정치학',t:'게리맨더링',w:'gerrymandering',d:'특정 정당에 유리하도록 선거구 경계를 자의적으로 그리는 일. 1812년 매사추세츠 주지사 게리의 이름과, 선거구가 도롱뇽 모양이었다는 데서 나온 말입니다.'},
 {e:'📣',c:'#F7DDD0',cat:'정치학',t:'오버턴 창',w:'Overton window',d:'한 사회에서 대중이 받아들일 수 있는 정책과 주장의 범위. 창의 위치는 고정되어 있지 않아, 과거에 금기였던 주장이 상식이 되기도 합니다.'},
 {e:'🐑',c:'#E6EFD2',cat:'경제학',t:'공유지의 비극',w:'tragedy of the commons',d:'모두가 쓸 수 있는 자원을 각자가 제 이익만 생각해 쓰다가 결국 모두 잃게 되는 현상. 하딘이 널리 알렸고, 오스트롬은 공동체가 이를 스스로 관리해 온 사례를 보여 주었습니다.'},
 {e:'🪙',c:'#FBEBC0',cat:'경제학',t:'기회비용',w:'opportunity cost',d:'어떤 선택을 하느라 포기한 것 중 가장 가치 있는 것. 공짜 영화표도 두 시간을 쓰는 순간 다른 일을 할 기회를 대가로 치르는 셈입니다.'},

async function cred(n){
  const raw = 'geul:' + n.toLowerCase(); let h;
  if (window.crypto && crypto.subtle) h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)))].map(b => b.toString(16).padStart(2, '0')).join('');
  else { let a = 5381, b = 52711; for (const c of raw) { a = (a * 33 ^ c.charCodeAt(0)) >>> 0; b = (b * 31 + c.charCodeAt(0)) >>> 0 } h = (a.toString(16) + b.toString(16)).padEnd(64, '0'); }
  return { email: 'u' + h.slice(0, 40) + '@geul.app', password: h.slice(40) + 'Gx' };
}

async function sha(raw){
  if (window.crypto && crypto.subtle) return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)))].map(b => b.toString(16).padStart(2, '0')).join('');
  let a = 5381, b = 52711; for (const c of raw) { a = (a * 33 ^ c.charCodeAt(0)) >>> 0; b = (b * 31 + c.charCodeAt(0)) >>> 0 } return (a.toString(16) + b.toString(16)).padEnd(64, '0');
}

const toData = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
function shrink(file){
  return new Promise((ok, no) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : no(new Error('image')), 'image/jpeg', .82);
    };
    im.onerror = () => no(new Error('image')); im.src = u;
  });
}

  }
  const entry = mine.find(p => p.prompt_key === ds), isToday = ds === today;
  v.innerHTML = `<div class="calhead"><button class="more" id="pm" aria-label="이전 달">‹</button><b>${y}년 ${mo + 1}월</b><button class="more" id="nm" aria-label="다음 달" ${isCur ? 'disabled' : ''}>›</button></div>
  <div class="cal">${['일','월','화','수','목','금','토'].map(w => `<i>${w}</i>`).join('')}${cells}</div>
  <div class="meta" style="margin-top:24px">${fmt(ds)}</div>
  ${entry ? `<p class="read">${esc(entry.body)}</p>${isToday ? '<button class="more" id="dt">삭제</button>' : ''}`
    : isToday ? `<textarea id="body" maxlength="5000" placeholder="오늘은 어떤 하루였나요" aria-label="오늘의 일기" style="margin-top:8px"></textarea>
       <div class="act"><button class="btn main" id="post">기록하고 다른 일기 보기</button></div>` : '<p class="msg">이 날의 기록이 없어요.</p>'}
  <div class="msg" id="msg"></div><div class="feed" id="df"></div>`;
  v.querySelectorAll('.d').forEach(b => b.onclick = () => { ds = b.dataset.k; diaryView(); });
  $('#pm').onclick = () => { dm = new Date(y, mo - 1, 1); diaryView(); };
  $('#nm').onclick = () => { dm = new Date(y, mo + 1, 1); diaryView(); };
  if (entry) loadFeed('diary', ds, $('#df'), true);
  if (entry && isToday) $('#dt').onclick = async () => { await api.del(entry.id); diaryView(); };
  if (!entry && isToday) $('#post').onclick = async () => {
    const body = $('#body').value.trim(), msg = $('#msg');
    if (!body) { msg.textContent = '내용을 입력해 주세요.'; return; }
    try { await api.post({ user_id: me.id, nickname: me.nickname, kind: 'diary', prompt_key: today, title: null, body }); diaryView(); }
    catch (e) { msg.textContent = e.code === '23505' ? '오늘의 일기는 이미 있어요.' : '기록하지 못했어요. 잠시 뒤 다시 시도해 주세요.'; }
  };
}

let rm = null;
async function roomView(){
  const v = $('#sub');
  if (!rm) {
    let rooms = []; try { rooms = await api.rooms(me.id); } catch (e) { console.error(e); }
    v.innerHTML = `<input class="ttl" id="rc" maxlength="30" placeholder="방 코드" aria-label="방 코드" autocomplete="off">
      <div class="act"><button class="btn main" id="rj">입장</button></div><div class="msg" id="msg"></div>
      <div style="margin-top:16px">${rooms.map(r => `<button class="item" data-r="${esc(r.room_id)}" data-l="${esc(r.label)}"><span class="th" style="background:var(--chip)">🔒</span><span><b>${esc(r.label)}</b></span></button>`).join('')}</div>`;
    const enter = async () => {
      const code = $('#rc').value.trim(), msg = $('#msg');
      if (code.length < 2) { msg.textContent = '방 코드는 2자 이상이어야 해요.'; return; }
      try { const id = await roomId(code); await api.joinRoom(me.id, id, code); rm = { room_id: id, label: code }; pushNav(); roomView(); }
      catch (e) { msg.textContent = '입장하지 못했어요. ' + (e.message || ''); }
    };
    $('#rj').onclick = enter; $('#rc').onkeydown = e => { if (e.key === 'Enter') enter(); };
    v.querySelectorAll('.item').forEach(b => b.onclick = () => { rm = { room_id: b.dataset.r, label: b.dataset.l }; pushNav(); roomView(); });
    return;
  }
  let file = null;
  v.innerHTML = `<div class="calhead"><button class="more" id="bk" aria-label="방 목록">‹</button><b>${esc(rm.label)}</b><button class="more" id="lv" style="font-size:13px">나가기</button></div>
    <textarea id="body" maxlength="5000" placeholder="오늘의 이야기" aria-label="일기"></textarea><img class="pv" id="pv" alt="" hidden>
    <div class="act"><label class="btn" style="display:grid;place-items:center;cursor:pointer">사진<input type="file" id="ph" accept="image/*" hidden></label><button class="btn main" id="rp">기록</button></div>
    <div class="msg" id="msg"></div><div id="rf"></div>`;
  $('#bk').onclick = () => { rm = null; pushNav(); roomView(); };
  $('#lv').onclick = async () => {
    if (!confirm('이 방에서 나갈까요? 다시 들어오려면 방 코드가 필요해요.')) return;
    try { await api.leaveRoom(me.id, rm.room_id); } catch (e) {} rm = null; history.replaceState(snap(), ''); roomView();
  };
  $('#ph').onchange = e => { file = e.target.files[0] || null; const pv = $('#pv'); pv.hidden = !file; if (file) pv.src = URL.createObjectURL(file); };
  $('#rp').onclick = async () => {
    const body = $('#body').value.trim(), msg = $('#msg');
    if (!body && !file) { msg.textContent = '내용이나 사진을 넣어 주세요.'; return; }
    try {
      const blob = file ? await shrink(file) : null;
      await api.roomPost({ room_id: rm.room_id, user_id: me.id, nickname: me.nickname, body, day: ymd(new Date()) }, blob);
      $('#body').value = ''; file = null; $('#ph').value = ''; $('#pv').hidden = true; msg.textContent = ''; loadRoomFeed();
    } catch (e) { msg.textContent = '기록하지 못했어요. ' + (e.message || ''); }
  };
  loadRoomFeed();
}

async function loadRoomFeed(){
  const el = $('#rf'); if (!el) return;
  try {
    const rows = await api.roomPosts(rm.room_id);
    const urls = await api.urls(rows.filter(p => p.image_path).map(p => p.image_path));
    const hs = await api.hearts('room', rows.map(p => p.id));
    let last = '';
    el.innerHTML = rows.map(p => {
      const head = p.day !== last ? `<div class="meta dh">${fmt(p.day)}</div>` : ''; last = p.day;
      return head + `<div class="post"><span class="av pf" data-u="${p.user_id}" data-n="${esc(p.nickname)}">${esc([...p.nickname][0])}</span><div class="t"><b class="pf" data-u="${p.user_id}" data-n="${esc(p.nickname)}">${esc(p.nickname)}</b>${p.body ? `<p>${esc(p.body)}</p>` : ''}
        ${p.image_path && urls[p.image_path] ? `<img class="ph" src="${urls[p.image_path]}" alt="첨부 사진" loading="lazy">` : ''}
        <div class="pr">${heartBtn('room', p.id, hs)}${p.user_id === me.id ? `<button data-del="${p.id}">삭제</button>` : ''}</div></div></div>`;
    }).join('');
    bindHearts(el);
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api.roomDel(rows.find(r => r.id == b.dataset.del)); loadRoomFeed(); });
  } catch (e) { el.innerHTML = '<div class="msg">불러오지 못했어요.</div>'; }
}

let dsub = 'pub', unread = 0, seenN = new Set(), pollT = null;
function diaryTab(){
  $('#view').innerHTML = `<div class="seg">${[['pub','공개 일기'],['room','비공개 방']].map(([k, n]) => `<button data-s="${k}" aria-current="${k === dsub}">${n}</button>`).join('')}</div><div id="sub"></div>`;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { dsub = b.dataset.s; pushNav(); diaryTab(); });
  dsub === 'pub' ? diaryView() : roomView();
}

function paintBadge(){
  const b = document.querySelector('.tabs [data-t="friend"]');
  if (b) b.innerHTML = '친구' + (unread ? `<sup class="bd">${unread > 9 ? '9+' : unread}</sup>` : '');
}
function toast(msg){
  let t = $('#toast');
  if (!t) { t = document.createElement('button'); t.id = 'toast'; t.hidden = true; t.onclick = () => { t.hidden = true; tab = 'friend'; shell(); }; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 5000);
}
async function poll(first){
  if (!me) return;
  try {
    const rows = await api.notifs(me.id), fresh = rows.filter(r => !seenN.has(r.id));
    rows.forEach(r => seenN.add(r.id)); unread = rows.length; paintBadge();
    if (!first && fresh.length) {
      const r = fresh[0], what = { request: '친구 요청을 보냈어요', accepted: '친구 요청을 수락했어요', diary: '일기를 썼어요' }[r.kind] || '새 글을 썼어요', txt = `${r.actor_name}님이 ${what}${fresh.length > 1 ? ` 외 ${fresh.length - 1}건` : ''}`;
      toast(txt);
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) { try { new Notification('GEUL', { body: txt }); } catch (e) {} }
    }
  } catch (e) { console.error(e); }
}
function startPoll(){ stopPoll(); poll(true); pollT = setInterval(() => poll(false), 30000); }
function stopPoll(){ clearInterval(pollT); pollT = null; seenN = new Set(); unread = 0; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(false); });

const KL = { write: '창작', contest: '공모', diary: '일기' };
const topicOf = p => { if (p.kind === 'diary') return fmt(p.prompt_key); const it = (p.kind === 'write' ? WRITE : CONTEST).find(x => x.k === p.prompt_key); return it ? [...it.p].slice(0, 36).join('') + '…' : ''; };

function friendView(){
  $('#view').innerHTML = `<input class="ttl" id="fn" maxlength="12" placeholder="닉네임으로 친구 요청" aria-label="친구 닉네임" autocomplete="off">
    <div class="act"><button class="btn main" id="fa">친구 요청</button></div><div class="msg" id="msg"></div>
    <div id="fl"></div><div class="feed" id="ff"></div>`;
  const add = async () => {
    const n = $('#fn').value.trim(), msg = $('#msg');
    if (n.length < 2) { msg.textContent = '친구 닉네임을 입력해 주세요.'; return; }
    try {
      const u = await api.findUser(n);
      if (!u) { msg.textContent = '그 닉네임은 찾을 수 없어요.'; return; }
      if (u.id === me.id) { msg.textContent = '나에게는 요청할 수 없어요.'; return; }
      const rel = (await api.friendships(me.id)).find(f => f.id === u.id);
      if (rel) { msg.textContent = rel.status === 'accepted' ? '이미 친구예요.' : rel.incoming ? '상대가 먼저 요청을 보냈어요. 아래에서 수락해 주세요.' : '이미 요청을 보냈어요.'; return; }
      await api.request(me.id, u.id); $('#fn').value = ''; msg.textContent = '요청을 보냈어요.'; loadFriends();
    } catch (e) { msg.textContent = '요청하지 못했어요. ' + (e.message || ''); }
  };
  $('#fa').onclick = add; $('#fn').onkeydown = e => { if (e.key === 'Enter') add(); };
  loadFriends();
}

async function loadFriends(){
  const today = ymd(new Date());
  try {
    const all = await api.friendships(me.id);
    const inc = all.filter(f => f.status === 'pending' && f.incoming), out = all.filter(f => f.status === 'pending' && !f.incoming), fr = all.filter(f => f.status === 'accepted');
    const chip = (f, suf) => `<span class="chip">${esc(f.nickname)}${suf}<button class="x" data-id="${f.id}" data-s="${f.status}" aria-label="삭제">×</button></span>`;
    const ask = 'Notification' in window && Notification.permission === 'default';
    $('#fl').innerHTML = inc.map(f => `<div class="req"><b>${esc(f.nickname)}</b><span><button class="btn main ok" data-id="${f.id}">수락</button><button class="btn no" data-id="${f.id}">거절</button></span></div>`).join('')
      + (fr.length || out.length ? `<div class="chips">${fr.map(f => chip(f, '')).join('')}${out.map(f => chip(f, ' · 대기')).join('')}</div>` : '')
      + (ask ? '<button class="more" id="np" style="margin-top:12px">브라우저 알림 켜기</button>' : '');
    const L = $('#fl');
    L.querySelectorAll('.ok').forEach(b => b.onclick = async () => { await api.accept(me.id, b.dataset.id); loadFriends(); });
    L.querySelectorAll('.no').forEach(b => b.onclick = async () => { await api.unfriend(me.id, b.dataset.id); loadFriends(); });
    L.querySelectorAll('.x').forEach(b => b.onclick = async () => { if (b.dataset.s === 'accepted' && !confirm('친구를 끊을까요?')) return; await api.unfriend(me.id, b.dataset.id); loadFriends(); });
    if ($('#np')) $('#np').onclick = () => Notification.requestPermission().then(loadFriends);
    const rows = await api.friendFeed(), hs = await api.hearts('post', rows.filter(r => r.unlocked).map(r => r.id));
    $('#ff').innerHTML = rows.map(r => {
      const head = `<span class="av pf" data-u="${r.user_id}" data-n="${esc(r.nickname)}">${esc([...r.nickname][0])}</span><div class="t"><b class="pf" data-u="${r.user_id}" data-n="${esc(r.nickname)}">${esc(r.nickname)}</b> <small style="color:var(--mute)">${KL[r.kind]}</small><span class="tp">${esc(topicOf(r))}</span>`;
      const go = (t) => `<button class="go" data-k="${r.kind}" data-key="${esc(r.prompt_key)}">${t}</button>`;
      if (r.unlocked) return `<div class="post">${head}${r.title ? `<strong>${esc(r.title)}</strong>` : ''}<p>${esc(r.body)}</p><div class="pr">${heartBtn('post', r.id, hs)}${go('글 보러가기')}</div></div></div>`;
      const can = r.kind !== 'diary' || r.prompt_key === today;
      return `<div class="post lock">${head}<p>🔒 나도 답하면 볼 수 있어요</p>${can ? `<div class="pr">${go('답하러 가기')}</div>` : ''}</div></div>`;
    }).join('');
    bindHearts($('#ff'));
    $('#ff').querySelectorAll('.go').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'diary') { dsub = 'pub'; ds = b.dataset.key; dm = null; tab = 'diary'; }
      else { idx[k] = (k === 'write' ? WRITE : CONTEST).findIndex(x => x.k === b.dataset.key); tab = k; }
      shell();
    });
    await api.readAll(me.id); unread = 0; paintBadge();
  } catch (e) { $('#ff').innerHTML = '<div class="msg">불러오지 못했어요.</div>'; }
}

async function openProfile(id, nick){
  if (!me || id === me.id) return;
  let all = []; try { all = await api.friendships(me.id); } catch (e) {}
  const rel = all.find(f => f.id === id);
  let st = !rel ? 'none' : rel.status === 'accepted' ? 'friend' : rel.incoming ? 'incoming' : 'sent';
  const el = document.createElement('div'); el.className = 'sheet'; el.onclick = e => { if (e.target === el) el.remove(); };
  const paint = () => {
    const lab = { none: '친구 요청', sent: '요청 보냄', incoming: '요청 수락', friend: '친구' }[st];
    el.innerHTML = `<div class="card"><span class="av big">${esc([...nick][0])}</span><h3>${esc(nick)}</h3><div class="msg" id="sm"></div>
      <button class="btn main" id="sa" ${st === 'sent' || st === 'friend' ? 'disabled' : ''}>${lab}</button>
      ${st === 'friend' || st === 'sent' ? `<button class="btn" id="sx">${st === 'friend' ? '친구 끊기' : '요청 취소'}</button>` : ''}<button class="btn" id="sc">닫기</button></div>`;
    $('#sc').onclick = () => el.remove();
    const done = () => { paint(); if (tab === 'friend') loadFriends(); };
    $('#sa').onclick = async () => { try { if (st === 'none') { await api.request(me.id, id); st = 'sent'; } else if (st === 'incoming') { await api.accept(me.id, id); st = 'friend'; } done(); } catch (e) { $('#sm').textContent = '처리하지 못했어요.'; } };
    if ($('#sx')) $('#sx').onclick = async () => { if (st === 'friend' && !confirm('친구를 끊을까요?')) return; try { await api.unfriend(me.id, id); st = 'none'; done(); } catch (e) { $('#sm').textContent = '처리하지 못했어요.'; } };
  };
  document.body.appendChild(el); paint();
}
document.addEventListener('click', e => { const t = e.target.closest('.pf'); if (t && t.dataset.u) openProfile(t.dataset.u, t.dataset.n); });

function boxView(){
  const cards = [...savedIds], head = t => `<div class="meta dh">${t}</div>`;
  const prompts = [...spSet].map(x => { const [kind, key] = x.split(':'), list = kind === 'write' ? WRITE : CONTEST, i = list.findIndex(p => p.k === key); return i < 0 ? null : { kind, i, it: list[i] }; }).filter(Boolean);
  const pItems = k => prompts.filter(p => p.kind === k).map(p => `<button class="item" data-k="${p.kind}" data-i="${p.i}"><span class="th" style="background:var(--chip)">${k === 'write' ? '✍️' : '🏆'}</span><span><b>${esc([...p.it.p].slice(0, 34).join(''))}…</b><small>${esc(k === 'write' ? p.it.len : p.it.h)}</small></span></button>`).join('');
  const w = pItems('write'), c = pItems('contest');
  $('#view').innerHTML = (cards.length ? head('학습 카드') + cards.map(i => `<button class="item" data-c="${i}"><span class="th" style="background:${CARDS[i].c}">${CARDS[i].e}</span><span><b>${esc(CARDS[i].t)}</b><small>${esc(CARDS[i].cat)}</small></span></button>`).join('') : '')
    + (w ? head('창작') + w : '') + (c ? head('공모') + c : '');
  document.querySelectorAll('.item').forEach(b => b.onclick = () => {
    if (b.dataset.c) { idx.learn = +b.dataset.c; tab = 'learn'; } else { idx[b.dataset.k] = +b.dataset.i; tab = b.dataset.k; }
    shell();
  });
}

boot();
</script>
</body>
