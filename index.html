<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEUL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mute:#8a8f98;--line:#ececee;--chip:#f4f4f5}
@media(prefers-color-scheme:dark){:root{--bg:#101012;--fg:#f2f2f3;--mute:#8d9099;--line:#26262a;--chip:#1c1c20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 6px}
.logo{font-weight:900;font-size:22px;letter-spacing:.1em}
.av{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0;color:var(--mute);font-weight:500}
.tabs button[aria-current=true]{color:var(--fg);font-weight:700;border-color:var(--fg)}
main{padding:20px 20px 56px}
.art{aspect-ratio:4/3;border-radius:18px;display:grid;place-items:center;font-size:76px;color:#16213A}
.meta{margin:18px 0 2px;font-size:13px;color:var(--mute)}
h2{margin:0;font-size:28px;line-height:1.35;font-weight:900;letter-spacing:-.02em}
.word{margin:2px 0 14px;font-size:14px;color:var(--mute)}
.read{font-family:'Noto Serif KR',serif;font-size:17px;line-height:1.9;margin:0}
.act{display:flex;gap:8px;margin-top:24px}
.btn{height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:700}
.btn.main{flex:1;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.on{background:var(--chip)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
.q{font-family:'Noto Serif KR',serif;font-size:23px;line-height:1.65;font-weight:600;margin:12px 0 18px}
textarea,.ttl{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:17px/1.85 'Noto Serif KR',serif;padding:8px 0;border-radius:0;resize:none;outline:none}
textarea{min-height:140px}
textarea:focus,.ttl:focus{border-color:var(--fg)}
.ttl{margin-bottom:6px;font-weight:600}
.msg{min-height:20px;margin-top:8px;font-size:13px;color:var(--mute)}
.feed{margin-top:28px}
.post{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.post .t{min-width:0;flex:1}
.post b{font-size:14px}
.post strong{display:block;font-family:'Noto Serif KR',serif}
.post p{margin:2px 0 0;font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.post button{border:0;background:none;padding:0;margin-top:4px;font-size:12px;color:var(--mute)}
.login{padding-top:18vh;text-align:center}
.login h1{margin:0 0 28px;font-size:46px;font-weight:900;letter-spacing:.1em}
.login input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:none;color:inherit;font:inherit;text-align:center}
.login .btn{width:100%;margin-top:10px}
.item{display:flex;gap:14px;align-items:center;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.item .th{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;color:#16213A}
.item b{display:block}
.item small{color:var(--mute)}
.who{display:flex;align-items:center;gap:10px}
.out{border:0;background:none;color:var(--mute);font-size:13px;padding:0}
.login .btn{margin-top:8px}
.login .sub{background:none}
.more{border:0;background:none;color:var(--mute);font-size:13px;padding:0;margin-top:6px}
.day{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.tabs button{font-size:15px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead .more{font-size:24px;margin:0;color:var(--fg);padding:0 8px}
.calhead .more:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal i{font-style:normal;font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{aspect-ratio:1;border:0;border-radius:50%;background:none;font:inherit;font-size:14px;position:relative}
.cal .d.today{font-weight:900;box-shadow:inset 0 0 0 1px var(--fg)}
.cal .d.sel{background:var(--fg);color:var(--bg)}
.cal .d.has::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cal .d:disabled{opacity:.28;cursor:default}
</style>
</head>

 {e:'🏛️',c:'#C9D6FF',cat:'철학',t:'아포리아',w:'aporia',d:'길이 막혀 더 나아갈 수 없는 상태. 소크라테스는 대화로 상대를 이 지점까지 데려가, 안다고 믿던 것이 사실은 모른다는 걸 깨닫게 했습니다. 모름을 아는 순간이 배움의 출발점입니다.'},
 {e:'🌊',c:'#BDE7F2',cat:'문학',t:'의식의 흐름',w:'stream of consciousness',d:'인물의 머릿속에 스치는 생각을 문법과 논리의 정리 없이 이어 쓰는 기법. 울프와 조이스가 대표적이며, 사람의 마음은 문장처럼 반듯하게 흐르지 않는다는 발견에서 나왔습니다.'},
 {e:'🪞',c:'#E3D4FF',cat:'심리학',t:'페르소나',w:'persona',d:'원래 고대 연극에서 배우가 쓰던 가면. 융은 이를 사회에서 요구받는 역할에 맞춰 내보이는 얼굴이라 불렀습니다. 가면이 나쁜 건 아니지만, 가면과 나를 혼동할 때 문제가 생깁니다.'},
 {e:'🍵',c:'#D5EBCF',cat:'미학',t:'와비사비',w:'侘寂',d:'불완전하고 덧없고 소박한 것에서 아름다움을 찾는 일본의 미의식. 금이 간 찻잔을 금으로 이어 붙이는 킨츠기에도 같은 생각이 담겨 있습니다.'},
 {e:'⚖️',c:'#FFE3B8',cat:'윤리학',t:'트롤리 딜레마',w:'trolley problem',d:'다섯 명을 살리려 한 명을 희생시켜도 되는가. 결과를 따지는 공리주의와 행위 자체의 옳고 그름을 따지는 의무론이 갈라지는 지점을 보여 주는 사고실험입니다.'},
 {e:'📜',c:'#F6CFCF',cat:'역사',t:'르네상스',w:'Renaissance',d:'프랑스어로 재탄생. 14~16세기 유럽에서 고대 그리스·로마의 인간 중심 사고를 되살려 예술과 학문을 일으킨 흐름입니다. 신 중심에서 인간 중심으로 시선이 옮겨 갔습니다.'},
 {e:'🗣️',c:'#CFE0F6',cat:'언어학',t:'사피어-워프 가설',w:'linguistic relativity',d:'우리가 쓰는 언어가 생각의 틀을 만든다는 주장. 색을 가리키는 낱말이 적은 언어권 사람은 색을 다르게 나눠 인식하는가 하는 실험들이 이어져 왔고, 강한 형태는 지금 대체로 부정됩니다.'},
 {e:'🕯️',c:'#EAD9C4',cat:'문학',t:'카타르시스',w:'catharsis',d:'아리스토텔레스가 비극의 효과로 꼽은 감정의 정화. 연민과 공포를 대신 겪고 나면 마음이 가벼워진다는 뜻으로, 오늘의 눈물 나는 영화와도 이어집니다.'},
 {e:'🔭',c:'#C8D3E8',cat:'과학철학',t:'패러다임',w:'paradigm',d:'쿤이 제시한 말로, 한 시대 과학자들이 공유하는 문제 설정과 사고의 틀. 천동설에서 지동설로 가듯 틀이 통째로 바뀌는 일을 과학혁명이라 불렀습니다.'},

 {e:'🎭',c:'#EED9F5',cat:'심리학',t:'투사',w:'projection',d:'자기 안의 받아들이기 힘든 감정이나 욕구를 남의 것으로 돌려 보는 방어기제. 내가 불안한데 상대가 나를 불안하게 한다고 느끼는 식입니다.'},
 {e:'🧒',c:'#FFE9C7',cat:'발달심리',t:'애착 이론',w:'attachment theory',d:'볼비와 에인스워스가 정리한 이론. 어린 시절 양육자와 맺은 관계가 이후 대인관계의 기본 틀이 된다고 봅니다. 안정, 불안, 회피 같은 유형으로 나눕니다.'},

 {e:'🔥',c:'#F9D5C8',cat:'심리학',t:'몰입',w:'flow',d:'칙센트미하이가 이름 붙인 상태로, 과제의 난도와 내 실력이 알맞게 맞물려 시간 가는 줄 모르고 빠져드는 경험. 너무 쉬우면 지루하고 너무 어려우면 불안해집니다.'},
 {e:'🏙️',c:'#CFE3F0',cat:'사회학',t:'젠트리피케이션',w:'gentrification',d:'낙후된 동네가 뜨면서 임대료가 오르고, 원래 살던 주민과 가게가 밀려나는 현상. 활기를 얻는 대신 그 동네를 만든 사람들을 잃는다는 역설이 있습니다.'},
 {e:'🪟',c:'#DDE5F4',cat:'사회학',t:'낙인 효과',w:'labeling theory',d:'사회가 어떤 사람에게 일탈자라는 이름표를 붙이면, 그 사람이 실제로 그 이름표에 맞게 행동하게 된다는 관점. 베커가 대표적 이론가입니다.'},

 {e:'🎁',c:'#F6D9DD',cat:'인류학',t:'증여론',w:'the gift',d:'마르셀 모스가 보인, 선물은 공짜가 아니라 주고, 받고, 답례해야 하는 의무의 고리라는 통찰. 선물이 사람 사이의 관계를 만든다는 것입니다.'},

const mem = {};
const ls = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null } catch (e) { return mem[k] ?? null } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { mem[k] = v } }
};
async function cred(n){
  const raw = 'geul:' + n.toLowerCase(); let h;
  if (window.crypto && crypto.subtle) h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)))].map(b => b.toString(16).padStart(2, '0')).join('');
  else { let a = 5381, b = 52711; for (const c of raw) { a = (a * 33 ^ c.charCodeAt(0)) >>> 0; b = (b * 31 + c.charCodeAt(0)) >>> 0 } h = (a.toString(16) + b.toString(16)).padEnd(64, '0'); }
  return { email: 'u' + h.slice(0, 40) + '@geul.app', password: h.slice(40) + 'Gx' };
}

const api = LIVE ? {
  async me(){
    const { data: { session } } = await sb.auth.getSession(); if (!session) return null;
    const { data } = await sb.from('profiles').select('nickname').eq('id', session.user.id).maybeSingle();
    return data ? { id: session.user.id, nickname: data.nickname } : null;
  },
  async login(n){
    const { data, error } = await sb.auth.signInWithPassword(await cred(n)); if (error) throw error;
    const { data: p } = await sb.from('profiles').select('nickname').eq('id', data.user.id).maybeSingle();
    return { id: data.user.id, nickname: p ? p.nickname : n };
  },
  async join(n){
    const { data, error } = await sb.auth.signUp(await cred(n)); if (error) throw error;
    if (!data.session) throw (data.user && data.user.identities && !data.user.identities.length ? { code: '23505' } : { message: 'confirm email' });
    const { error: e2 } = await sb.from('profiles').insert({ id: data.user.id, nickname: n }); if (e2) throw e2;
    return { id: data.user.id, nickname: n };
  },
  async logout(){ await sb.auth.signOut(); },
  async saved(u){ const { data } = await sb.from('saved_cards').select('card_id').eq('user_id', u); return (data || []).map(r => r.card_id); },
  async save(u, id, on){ on ? await sb.from('saved_cards').upsert({ user_id: u, card_id: id }) : await sb.from('saved_cards').delete().match({ user_id: u, card_id: id }); },
  async posts(kind, key){
    const { data, error } = await sb.from('posts').select('*').eq('kind', kind).eq('prompt_key', key).order('created_at', { ascending: false }).limit(40);
    if (error) throw error; return data;
  },
  async mine(u, kind){ const { data } = await sb.from('posts').select('*').eq('kind', kind).eq('user_id', u).order('prompt_key', { ascending: false }).limit(90); return data || []; },
  async post(p){ const { error } = await sb.from('posts').insert(p); if (error) throw error; },
  async del(id){ await sb.from('posts').delete().eq('id', id); }
} : {
  async me(){ return ls.get('geul_me'); },
  async login(n){ if (!(ls.get('geul_users') || {})[n.toLowerCase()]) throw { code: 'nouser' }; const m = { id: 'l:' + n, nickname: n }; ls.set('geul_me', m); return m; },
  async join(n){ const u = ls.get('geul_users') || {}; if (u[n.toLowerCase()]) throw { code: '23505' }; u[n.toLowerCase()] = 1; ls.set('geul_users', u); const m = { id: 'l:' + n, nickname: n }; ls.set('geul_me', m); return m; },
  async logout(){ ls.set('geul_me', null); },
  async saved(u){ return ls.get('geul_saved_' + u) || []; },
  async save(u, id, on){ const s = new Set(ls.get('geul_saved_' + u) || []); on ? s.add(id) : s.delete(id); ls.set('geul_saved_' + u, [...s]); },
  async posts(kind, key){
    const all = (ls.get('geul_posts') || []).filter(p => p.kind === kind && p.prompt_key === key), m = ls.get('geul_me');
    return m && all.some(p => p.user_id === m.id) ? all.reverse() : [];
  },
  async mine(u, kind){ return (ls.get('geul_posts') || []).filter(p => p.kind === kind && p.user_id === u).sort((a, b) => b.prompt_key.localeCompare(a.prompt_key)); },
  async post(p){ const a = ls.get('geul_posts') || []; if (p.kind === 'diary' && a.some(x => x.kind === 'diary' && x.user_id === p.user_id && x.prompt_key === p.prompt_key)) throw { code: '23505' }; a.push({ ...p, id: Date.now() }); ls.set('geul_posts', a); },
  async del(id){ ls.set('geul_posts', (ls.get('geul_posts') || []).filter(p => p.id != id)); }
};

const $app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = (n, cur) => { let i; do { i = Math.floor(Math.random() * n) } while (n > 1 && i === cur); return i; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmt = s => new Date(s + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
const em = e => { const m = e.message || ''; return e.code === '23505' || /already/i.test(m) ? '이미 사용 중인 닉네임이에요.'
  : e.code === 'nouser' || /invalid login/i.test(m) ? '가입된 닉네임이 없어요. 가입을 눌러 주세요.'
  : /fetch|network/i.test(m) ? '서버에 연결하지 못했어요. SUPABASE_URL과 키를 확인해 주세요.'
  : /confirm/i.test(m) ? 'Supabase에서 Confirm email을 꺼 주세요.' : '오류가 났어요. ' + m; };
let me = null, tab = 'learn', idx = { learn: -1, write: -1, contest: -1 }, savedIds = new Set();

async function boot(){
  try { me = await api.me(); if (me) { savedIds = new Set(await api.saved(me.id)); return shell(); } } catch (e) { console.error(e); }
  loginView();
}

function loginView(){
  $app.innerHTML = `<main class="login"><h1>GEUL</h1><input id="nick" maxlength="12" placeholder="닉네임" aria-label="닉네임" autocomplete="off" value="${esc(ls.get('geul_last') || '')}">
  <button class="btn main" id="go" style="width:100%">시작</button><div class="msg" id="msg"></div></main>`;
  const go = async () => {
    const nick = $('#nick').value.trim(), msg = $('#msg');
    if (nick.length < 2 || nick.length > 12) { msg.textContent = '닉네임은 2~12자로 입력해 주세요.'; return; }
    msg.textContent = '';
    try {
      try { me = await api.login(nick); }
      catch (e) { if (e.code === 'nouser' || /invalid login/i.test(e.message || '')) me = await api.join(nick); else throw e; }
      ls.set('geul_last', nick); savedIds = new Set(await api.saved(me.id)); tab = 'learn'; shell();
    } catch (e) { msg.textContent = em(e); }
  };
  $('#go').onclick = go;
  $('#nick').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function shell(){
  const tabs = [['learn','학습'],['write','창작'],['contest','공모'],['diary','일기'],['box','보관함']];
  $app.innerHTML = `<header><span class="logo">GEUL</span><span class="who"><button class="out" id="out">로그아웃</button><span class="av" title="${esc(me.nickname)}">${esc([...me.nickname][0])}</span></span></header>
  <div class="tabs">${tabs.map(([k, n]) => `<button data-t="${k}" aria-current="${k === tab}">${n}</button>`).join('')}</div><main id="view"></main>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; shell(); });
  $('#out').onclick = async () => { try { await api.logout(); } catch (e) {} me = null; dm = ds = null; idx = { learn: -1, write: -1, contest: -1 }; loginView(); };
  ({ learn: learnView, write: () => promptView('write', WRITE), contest: () => promptView('contest', CONTEST), diary: diaryView, box: boxView })[tab]();
  scrollTo(0, 0);
}

function learnView(){
  if (idx.learn < 0) idx.learn = pick(CARDS.length, -1);
  const c = CARDS[idx.learn], on = savedIds.has(idx.learn);
  $('#view').innerHTML = `<div class="art" style="background:${c.c}" aria-hidden="true">${c.e}</div>
  <div class="meta">${esc(c.cat)}</div><h2>${esc(c.t)}</h2><div class="word">${esc(c.w)}</div><p class="read">${esc(c.d)}</p>
  <div class="act"><button class="btn ${on ? 'on' : ''}" id="sv">${on ? '저장됨' : '저장'}</button><button class="btn main" id="nx">다음</button></div>`;
  $('#nx').onclick = () => { idx.learn = pick(CARDS.length, idx.learn); learnView(); scrollTo(0, 0); };
  $('#sv').onclick = async () => {
    const next = !savedIds.has(idx.learn);
    next ? savedIds.add(idx.learn) : savedIds.delete(idx.learn);
    learnView(); try { await api.save(me.id, idx.learn, next); } catch (e) { console.error(e); }
  };
}

function promptView(kind, list){
  if (idx[kind] < 0) idx[kind] = pick(list.length, -1);
  const it = list[idx[kind]], isW = kind === 'write';
  $('#view').innerHTML = `<span class="chip">${isW ? esc(it.len) : '공모 · ' + esc(it.h)}</span><p class="q">${esc(it.p)}</p>
  ${isW ? '<input class="ttl" id="ttl" maxlength="60" placeholder="제목 (선택)" aria-label="제목">' : ''}
  <textarea id="body" maxlength="5000" placeholder="${isW ? '이어서 써 보세요' : '재치 있는 답을 남겨 보세요'}" aria-label="내 글"></textarea>
  <div class="act"><button class="btn main" id="post">게시하고 다른 글 보기</button><button class="btn" id="nx">다음 주제</button></div><div class="msg" id="msg"></div><div class="feed" id="feed"></div>`;
  $('#nx').onclick = () => { idx[kind] = pick(list.length, idx[kind]); promptView(kind, list); scrollTo(0, 0); };
  $('#post').onclick = async () => {
    const body = $('#body').value.trim(), msg = $('#msg');
    if (!body) { msg.textContent = '내용을 입력해 주세요.'; return; }
    try {
      await api.post({ user_id: me.id, nickname: me.nickname, kind, prompt_key: it.k, title: isW ? ($('#ttl').value.trim() || null) : null, body });
      $('#body').value = ''; if (isW) $('#ttl').value = ''; msg.textContent = ''; loadFeed(kind, it.k, $('#feed'));
    } catch (e) { msg.textContent = '게시하지 못했어요. 잠시 뒤 다시 시도해 주세요.'; }
  };
  loadFeed(kind, it.k, $('#feed'));
}

async function loadFeed(kind, key, el, skipMine){
  if (!el) return;
  try {
    let rows = await api.posts(kind, key); if (skipMine) rows = rows.filter(p => p.user_id !== me.id);
    el.innerHTML = rows.map(p => `<div class="post"><span class="av">${esc([...p.nickname][0])}</span><div class="t"><b>${esc(p.nickname)}</b>
      ${p.title ? `<strong>${esc(p.title)}</strong>` : ''}<p>${esc(p.body)}</p>${p.user_id === me.id ? `<button data-del="${p.id}">삭제</button>` : ''}</div></div>`).join('');
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api.del(b.dataset.del); loadFeed(kind, key, el, skipMine); });
  } catch (e) { el.innerHTML = '<div class="msg">글을 불러오지 못했어요.</div>'; }
}

let dm = null, ds = null;
async function diaryView(){
  const today = ymd(new Date()), v = $('#view');
  if (!ds) ds = today;
  if (!dm) dm = new Date(+ds.slice(0, 4), +ds.slice(5, 7) - 1, 1);
  let mine = []; try { mine = await api.mine(me.id, 'diary'); } catch (e) { console.error(e); }
  const has = new Set(mine.map(p => p.prompt_key)), y = dm.getFullYear(), mo = dm.getMonth();
  const lead = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
  const isCur = y === +today.slice(0, 4) && mo === +today.slice(5, 7) - 1;
  let cells = '<span></span>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = ymd(new Date(y, mo, d));
    cells += `<button class="d${k === ds ? ' sel' : ''}${k === today ? ' today' : ''}${has.has(k) ? ' has' : ''}" data-k="${k}" aria-label="${fmt(k)}" ${k > today ? 'disabled' : ''}>${d}</button>`;
  }
  const entry = mine.find(p => p.prompt_key === ds), isToday = ds === today;
  v.innerHTML = `<div class="calhead"><button class="more" id="pm" aria-label="이전 달">‹</button><b>${y}년 ${mo + 1}월</b><button class="more" id="nm" aria-label="다음 달" ${isCur ? 'disabled' : ''}>›</button></div>
  <div class="cal">${['일','월','화','수','목','금','토'].map(w => `<i>${w}</i>`).join('')}${cells}</div>
  <div class="meta" style="margin-top:24px">${fmt(ds)}</div>
  ${entry ? `<p class="read">${esc(entry.body)}</p>${isToday ? '<button class="more" id="dt">삭제</button>' : ''}`
    : isToday ? `<textarea id="body" maxlength="5000" placeholder="오늘은 어떤 하루였나요" aria-label="오늘의 일기" style="margin-top:8px"></textarea>
       <div class="act"><button class="btn main" id="post">기록하고 다른 일기 보기</button></div>` : '<p class="msg">이 날의 기록이 없어요.</p>'}
  <div class="msg" id="msg"></div><div class="feed" id="df"></div>`;
  v.querySelectorAll('.d').forEach(b => b.onclick = () => { ds = b.dataset.k; diaryView(); });
  $('#pm').onclick = () => { dm = new Date(y, mo - 1, 1); diaryView(); };
  $('#nm').onclick = () => { dm = new Date(y, mo + 1, 1); diaryView(); };
  if (entry) loadFeed('diary', ds, $('#df'), true);
  if (entry && isToday) $('#dt').onclick = async () => { await api.del(entry.id); diaryView(); };
  if (!entry && isToday) $('#post').onclick = async () => {
    const body = $('#body').value.trim(), msg = $('#msg');
    if (!body) { msg.textContent = '내용을 입력해 주세요.'; return; }
    try { await api.post({ user_id: me.id, nickname: me.nickname, kind: 'diary', prompt_key: today, title: null, body }); diaryView(); }
    catch (e) { msg.textContent = e.code === '23505' ? '오늘의 일기는 이미 있어요.' : '기록하지 못했어요. 잠시 뒤 다시 시도해 주세요.'; }
  };
}

function boxView(){
  const ids = [...savedIds];
  $('#view').innerHTML = ids.map(i => `<button class="item" data-i="${i}"><span class="th" style="background:${CARDS[i].c}">${CARDS[i].e}</span><span><b>${esc(CARDS[i].t)}</b><small>${esc(CARDS[i].cat)}</small></span></button>`).join('');
  document.querySelectorAll('.item').forEach(b => b.onclick = () => { idx.learn = +b.dataset.i; tab = 'learn'; shell(); });
}

boot();
</script>
